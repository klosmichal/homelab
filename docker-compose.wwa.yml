# Temporary stack: exposes klosmichal/surprise-app at wwa.michalklos.com for a
# few days, then torn down. Kept separate from docker-compose.yml so the core
# stack is never touched.
#
#   Clone source: just wwa-clone   (-> ${APPDATA_ROOT}/wwa/app)
#   Bring up:     just wwa-up      (builds the image, then starts)
#   Tear down:    just wwa-down
#
# The app is a single container (multi-stage build: Vite static build served by
# FastAPI) listening on :8000 and handling everything itself:
#   /                    -> SPA (built frontend)
#   /api/* , /uploads/*  -> FastAPI
#   /gallery             -> proof gallery HTML
# So the homelab side is just one Traefik router. wwa.michalklos.com resolves to
# the LAN IP via AdGuard's *.michalklos.com rewrite (LAN + Tailscale only); the
# cert is issued by the existing Let's Encrypt resolver.

name: wwa

networks:
  proxy:
    external: true
    name: proxy

volumes:
  wwa_data:   # SQLite DB + uploaded proofs (/data in the container)

services:
  wwa:
    build: ${APPDATA_ROOT:-/srv/homelab}/wwa/app
    image: wwa-surprise-app:latest
    container_name: wwa
    restart: unless-stopped
    volumes:
      - wwa_data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.wwa.rule=Host(`wwa.michalklos.com`)
      - traefik.http.routers.wwa.entrypoints=websecure
      - traefik.http.routers.wwa.tls.certresolver=letsencrypt
      - traefik.http.services.wwa.loadbalancer.server.port=8000
