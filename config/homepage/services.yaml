---
- Infra:
    - Tailscale:
        icon: tailscale.svg
        href: https://login.tailscale.com/admin
        description: Mesh VPN
        target: _blank

    - Portainer:
        icon: portainer.svg
        href: https://portainer.michalklos.com
        description: Container manager
        widget:
          type: portainer
          url: http://portainer:9000
          env: 1
          key: "{{HOMEPAGE_VAR_PORTAINER_API_KEY}}"

    - AdGuard Home:
        icon: adguard-home.svg
        href: https://dns.michalklos.com
        description: DNS & ad blocking
        widget:
          type: adguard
          url: http://adguardhome:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

- Media & Home:
    - Immich:
        icon: immich.svg
        href: https://immich.michalklos.com
        description: Photo library
        widget:
          type: immich
          url: http://immich_server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"

    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.michalklos.com
        description: Media server
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - FileBrowser:
        icon: filebrowser.svg
        href: https://files.michalklos.com
        description: File manager

    - Samba:
        icon: samba.svg
        description: Network shares
        href: smb://192.168.10.10

    - Home Assistant:
        icon: home-assistant.svg
        href: https://ha.michalklos.com
        description: Home automation
        widget:
          type: homeassistant
          url: http://host.docker.internal:8123
          key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"

- Arr:
    - Gluetun:
        icon: gluetun.svg
        href: https://qbit.michalklos.com
        description: VPN gateway (NordVPN)
        widget:
          type: gluetun
          url: http://gluetun:8000

    - qBittorrent:
        icon: qbittorrent.svg
        href: https://qbit.michalklos.com
        description: Torrent client
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"

    - Seerr:
        icon: jellyseerr.svg
        href: https://seerr.michalklos.com
        description: Media requests
        widget:
          type: jellyseerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"

    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.michalklos.com
        description: Indexer manager
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"

    - Radarr:
        icon: radarr.svg
        href: https://radarr.michalklos.com
        description: Movie manager
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"

    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.michalklos.com
        description: TV show manager
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"

    - Bazarr:
        icon: bazarr.svg
        href: https://bazarr.michalklos.com
        description: Subtitle manager
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"
