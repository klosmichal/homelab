# Mosquitto: MQTT broker between Zigbee2MQTT and Home Assistant.
# Mounted read-only straight from the repo; restart the container after editing.
# The password file is not in the repo: the container builds it from
# MQTT_USERNAME / MQTT_PASSWORD in .env on every start.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
