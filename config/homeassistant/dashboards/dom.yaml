  # ──────────────────────────── System ────────────────────────────
  - title: System
    path: system
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Problemy
            icon: mdi:alert-circle
          # HA's own persistent notifications cannot be listed by a card, so
          # this shows the conditions that raise them (packages/dashboard.yaml).
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              {% set lista = state_attr('sensor.dom_problemy', 'lista') or [] %}
              {% if lista %}
              {% for p in lista %}
              - {{ p }}
              {% endfor %}
              {% else %}
              Wszystko działa.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Aktualizacje
            icon: mdi:package-up
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              {% set u = states.update | selectattr('state', 'eq', 'on') | sort(attribute='name') | list %}
              {% if u %}
              {% for x in u %}
              - **{{ x.name }}**: {{ x.attributes.installed_version }} → {{ x.attributes.latest_version }}
              {% endfor %}
              {% else %}
              Brak oczekujących aktualizacji.
              {% endif %}
          - type: tile
            entity: sensor.dom_aktualizacje
            name: Otwórz aktualizacje
            icon: mdi:open-in-app
            grid_options:
              columns: 12
            tap_action:
              action: navigate
              navigation_path: /config/updates

      - type: grid
        cards:
          - type: heading
            heading: Sieć
            icon: mdi:lan
          - type: tile
            entity: binary_sensor.zigbee2mqtt_bridge_connection_state
            name: Zigbee2MQTT
          - type: tile
            entity: sensor.zigbee2mqtt_bridge_version
            name: Wersja Z2M
          - type: tile
            entity: binary_sensor.slzb_mr5u_ethernet
            name: SLZB Ethernet
          - type: tile
            entity: binary_sensor.slzb_mr5u_internet
            name: SLZB Internet
          - type: tile
            entity: sensor.slzb_mr5u_core_chip_temp
            name: SLZB temp.
          - type: tile
            entity: binary_sensor.archer_be230_wan_status
            name: Router WAN
          - type: heading
            heading: Baterie
            icon: mdi:battery
          - type: tile
            entity: sensor.termostat_salon_battery
            name: Termostat salon
          - type: tile
            entity: sensor.biuro_czujnik_biuro_battery
            name: Czujnik biuro
          - type: tile
            entity: sensor.sypialnia_czujnik_sypialnia_battery
            name: Czujnik sypialnia
          - type: tile
            entity: sensor.x50_ultra_complete_battery_level
            name: Odkurzacz
          - *nawigacja
