
# Loads default set of integrations. Do not remove.
default_config:

# Repo-owned YAML lives here. automations.yaml / scenes.yaml / scripts.yaml are
# pull-only in scripts/config-sync.sh because the HA UI rewrites them, so
# anything that should be version-controlled and pushed goes into packages/.
homeassistant:
  packages: !include_dir_named packages

logger:
  default: info
  logs:
    custom_components.gree_cloud: debug
    greeclimate: debug

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Repo-owned dashboard. The default dashboard and the UI-built ones stay in
# storage mode, and so do the frontend resources, so HACS keeps registering
# its cards by itself.
lovelace:
  dashboards:
    dashboard-dom:
      mode: yaml
      title: Dom
      icon: mdi:home-variant
      show_in_sidebar: true
      filename: dashboards/dom.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
